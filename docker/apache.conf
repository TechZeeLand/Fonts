ServerTokens Prod
ServerSignature Off
TraceEnable Off

<Directory /var/www/html/public>
    Options -Indexes -MultiViews
    AllowOverride None
    Require all granted
    # every URL that is not a real file is handled by the PHP front controller
    FallbackResource /index.php
</Directory>

<FilesMatch "^\.">
    Require all denied
</FilesMatch>


<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    <LocationMatch "^/assets/">
        Header set Cache-Control "public, max-age=604800"
    </LocationMatch>
</IfModule>

<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/css text/plain text/markdown text/javascript application/javascript application/json application/xml image/svg+xml font/ttf font/otf
</IfModule>
